spring.application.name=bootiful-javafx
#
# tag::server[]
# the loopback listener the authorization server redirects back to. RFC 8252 wants
# 127.0.0.1, not "localhost", and the port has to match the redirect URI registered with
# the authorization server exactly.
server.address=127.0.0.1
server.port=8385
# end::server[]
#
# tag::client[]
# we are a *public* client: no secret, so client-authentication-method=none. PKCE is what
# takes its place, and Spring Security turns it on for us because there is no secret.
spring.security.oauth2.client.registration.javafx.provider=spring
spring.security.oauth2.client.registration.javafx.client-id=javafx
spring.security.oauth2.client.registration.javafx.client-authentication-method=none
spring.security.oauth2.client.registration.javafx.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.javafx.redirect-uri=http://127.0.0.1:${server.port}/login/oauth2/code/javafx
spring.security.oauth2.client.registration.javafx.scope[0]=openid
spring.security.oauth2.client.registration.javafx.scope[1]=profile
spring.security.oauth2.client.registration.javafx.scope[2]=email
spring.security.oauth2.client.provider.spring.issuer-uri=http://localhost:9090
# end::client[]
#
spring.threads.virtual.enabled=true
